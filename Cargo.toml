[package]
name = "avet"
version = "0.0.0"          # placeholder - real version is the git tag (Docker/AppImage releases)
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.95"          # MSRV floor; the build toolchain (Docker/CI RUST_VERSION) can be newer

[[bin]]
name = "avet"
path = "src/main.rs"

[dependencies]
serde              = { version = "1.0",   features = ["derive"] }
serde_json         = "1.0"
toml               = "1.1"
anyhow             = "1.0"
av-scenechange     = "0.24"
dolby_vision       = "3.4"
y4m                = "0.8"
tracing            = "0.1"
tracing-subscriber = { version = "0.3",  features = ["fmt", "env-filter"] }
signal-hook        = "0.4"

[dev-dependencies]
tempfile = "3.27"
proptest = "1.11"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = true
panic         = "abort"
