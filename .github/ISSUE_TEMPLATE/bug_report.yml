name: Bug Report
description: Something is not working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please fill in as much detail as possible. Enable `RUST_LOG=debug` and attach the logs.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The output of `docker logs` or of the AppImage in its terminal.
      render: text

  - type: input
    id: version
    attributes:
      label: avet version
      placeholder: "from the avet started log line or avet --version, e.g. v2.0.0 or dev-1a2b3c4"
    validations:
      required: true
