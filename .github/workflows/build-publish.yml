name: Build & Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: The release tag to build and publish, such as v1.5.0
        required: true
        type: string

env:
  GITHUB_IMAGE: ghcr.io/ivenos/avet
  DOCKERHUB_IMAGE: ivenos/avet
  RUST_VERSION: "1.99.0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: The image and the AppImage pin the same versions
        run: |
          ok=1
          for pin in SVT_AV1_VERSION SVT_AV1_HDR_REF FFMS2_VERSION VSHIP_VERSION VMAF_VERSION RUST_VERSION; do
            image=$(sed -n "s/^ARG $pin=//p" Dockerfile)
            appimage=$(sed -n "s/^  $pin: *\"\{0,1\}\([^\" ]*\)\"\{0,1\}\$/\1/p" .github/workflows/appimage.yml)
            [ -n "$image" ] && [ "$image" = "$appimage" ] \
              || { echo "::error::$pin is '$image' in the Dockerfile and '$appimage' in appimage.yml"; ok=0; }
          done
          image=$(sed -n 's/^ARG RUST_VERSION=//p' Dockerfile)
          [ "$image" = "$RUST_VERSION" ] \
            || { echo "::error::RUST_VERSION is '$image' in the Dockerfile and '$RUST_VERSION' in this workflow"; ok=0; }
          [ "$ok" = 1 ]

      # The version the image builds with, not `stable`: a newly stabilized API would
      # pass here and fail 25 minutes later inside the image build.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffms2-dev nasm

      - name: Run unit tests
        run: cargo test --locked

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffms2-dev nasm

      - name: Check
        run: cargo check --locked --all-targets

  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.suites.outputs.list }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: List suites
        id: suites
        run: |
          list=$(find test/suites -name '*.sh' -printf '%f\n' | sed 's/\.sh$//' | sort | jq -Rsc 'split("\n")[:-1]')
          # An empty matrix skips the job, and a skipped job counts as passed below.
          [ "$list" != "[]" ] || { echo "::error::no test suites found"; exit 1; }
          echo "list=$list" >> "$GITHUB_OUTPUT"

  image:
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The same value as in the build job, so that job reuses this one's layers.
      - name: Resolve version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG:-dev-${GITHUB_SHA:0:7}}"
          case "$VERSION" in
            *[!A-Za-z0-9._-]*) echo "::error::refusing unusual version name"; exit 1 ;;
          esac
          echo "AVET_VERSION=$VERSION" >> "$GITHUB_ENV"

      # Not test/run.sh's own build: without the layer cache, SVT-AV1, FFMS2 and Vship
      # eat the timeout before the first test runs.
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: AVET_VERSION=${{ env.AVET_VERSION }}
          tags: avet:test
          outputs: type=docker,dest=${{ runner.temp }}/avet-test.tar
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Build fixture tools image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: test/tools.Dockerfile
          tags: avet:fixture-tools
          outputs: type=docker,dest=${{ runner.temp }}/avet-fixture-tools.tar

      - name: Every bundled tool starts
        run: |
          docker load -i "$RUNNER_TEMP/avet-test.tar"
          docker run --rm -e AVET_VERSION --entrypoint sh avet:test -c '
            set -e
            ffmpeg   -hide_banner -version >/dev/null
            ffprobe  -hide_banner -version >/dev/null
            mkvmerge --version             >/dev/null
            SvtAv1EncApp     --version     >/dev/null
            SvtAv1EncApp-hdr --version     >/dev/null
            vmaf             --version     >/dev/null
            ffmsindex 2>&1 | grep -qi usage
            FFVship --list-gpu             >/dev/null
            [ "$(avet --version)" = "avet $AVET_VERSION" ]
          '

      - name: The image has the FFmpeg and MKVToolNix of the AppImage
        run: |
          ok=1
          want=$(sed -n 's/^  FFMPEG_VERSION: n//p' .github/workflows/appimage.yml)
          have=$(docker run --rm --entrypoint ffmpeg avet:test -version | sed -n 's/^ffmpeg version \([0-9.]*\).*/\1/p')
          [ "$want" = "$have" ] || { echo "::error::the image has FFmpeg $have, appimage.yml builds $want"; ok=0; }
          want=$(sed -n 's/^  MKVTOOLNIX_VERSION: "\(.*\)"/\1/p' .github/workflows/appimage.yml)
          have=$(docker run --rm --entrypoint mkvmerge avet:test --version | sed -n 's/^mkvmerge v\([0-9.]*\).*/\1/p')
          [ "$want" = "$have" ] || { echo "::error::the image has MKVToolNix $have, appimage.yml installs $want"; ok=0; }
          [ "$ok" = 1 ]

      - name: Upload test images
        uses: actions/upload-artifact@v7
        with:
          name: avet-test-image-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/avet-test.tar
            ${{ runner.temp }}/avet-fixture-tools.tar
          if-no-files-found: error
          retention-days: 1

  integration:
    name: integration (${{ matrix.suite }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [suites, image]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.suites.outputs.list) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Download test images
        uses: actions/download-artifact@v8
        with:
          name: avet-test-image-${{ matrix.arch }}
          path: ${{ runner.temp }}

      - name: Load test images
        run: |
          docker load -i "$RUNNER_TEMP/avet-test.tar"
          docker load -i "$RUNNER_TEMP/avet-fixture-tools.tar"

      - name: Run integration tests
        env:
          SUITE: ${{ matrix.suite }}
        run: ./test/run.sh --no-build --verbose "$SUITE"

  build:
    needs: [test, msrv, integration]
    if: github.ref == 'refs/heads/main' || inputs.tag != ''
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-26.04-arm

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG:-dev-${GITHUB_SHA:0:7}}"
          case "$VERSION" in
            *[!A-Za-z0-9._-]*) echo "::error::refusing unusual version name"; exit 1 ;;
          esac
          echo "AVET_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Read the commit that was checked out
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GITHUB_IMAGE }}
          labels: |
            org.opencontainers.image.licenses=GPL-3.0-only
            org.opencontainers.image.version=${{ env.AVET_VERSION }}
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: AVET_VERSION=${{ env.AVET_VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ env.GITHUB_IMAGE }},docker.io/${{ env.DOCKERHUB_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  push:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GITHUB_IMAGE }}
            docker.io/${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' && inputs.tag == '' }}
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=semver,pattern={{major}},value=${{ inputs.tag }}

      - name: Create and push multi-arch manifest to GHCR
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map(select(startswith("ghcr.io"))) | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.GITHUB_IMAGE }}@sha256:%s ' *)

      - name: Prepare Docker Hub README
        if: inputs.tag != ''
        run: |
          printf '**Note:** This description is automatically generated from the [GitHub repository README](https://github.com/ivenos/avet).\n\n---\n\n' \
            | cat - README.md > /tmp/dockerhub-readme.md

      - name: Create and push multi-arch manifest to Docker Hub
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map(select(startswith("ghcr.io") | not)) | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'docker.io/${{ env.DOCKERHUB_IMAGE }}@sha256:%s ' *)

      - name: Update Docker Hub description
        if: inputs.tag != ''
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          readme-filepath: /tmp/dockerhub-readme.md
