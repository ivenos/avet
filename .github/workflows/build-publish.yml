name: Build & Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GITHUB_IMAGE: ghcr.io/ivenos/avet
  DOCKERHUB_IMAGE: ivenos/avet
  RUST_VERSION: "1.98.1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The version the image builds with, not `stable`: a newly stabilized API would
      # pass here and fail 25 minutes later inside the image build.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffms2-dev nasm

      - name: Run unit tests
        run: cargo test --locked

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffms2-dev nasm

      - name: Check
        run: cargo check --locked --all-targets

  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.suites.outputs.list }}
    steps:
      - uses: actions/checkout@v7

      - name: List suites
        id: suites
        run: |
          list=$(find test/suites -name '*.sh' -printf '%f\n' | sed 's/\.sh$//' | sort | jq -Rsc 'split("\n")[:-1]')
          # An empty matrix skips the job, and a skipped job counts as passed below.
          [ "$list" != "[]" ] || { echo "::error::no test suites found"; exit 1; }
          echo "list=$list" >> "$GITHUB_OUTPUT"

  image:
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Not test/run.sh's own build: without the layer cache, SVT-AV1, FFMS2 and Vship
      # eat the timeout before the first test runs.
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: avet:test
          outputs: type=docker,dest=${{ runner.temp }}/avet-test.tar
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Build fixture tools image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: test/tools.Dockerfile
          tags: avet:fixture-tools
          outputs: type=docker,dest=${{ runner.temp }}/avet-fixture-tools.tar

      - name: Every bundled tool starts
        run: |
          docker load -i "$RUNNER_TEMP/avet-test.tar"
          docker run --rm --entrypoint sh avet:test -c '
            set -e
            ffmpeg   -hide_banner -version >/dev/null
            ffprobe  -hide_banner -version >/dev/null
            mkvmerge --version             >/dev/null
            SvtAv1EncApp     --version     >/dev/null
            SvtAv1EncApp-hdr --version     >/dev/null
            vmaf             --version     >/dev/null
            ffmsindex 2>&1 | grep -qi usage
            FFVship --list-gpu             >/dev/null
            # avet is a daemon and takes no arguments, so `avet --version` would run the
            # scan loop until this job times out.
            timeout -s KILL 10 avet >/tmp/start.log 2>&1 || true
            grep -q "avet started" /tmp/start.log
          '
          want=$(sed -n 's/^  FFMPEG_VERSION: n//p' .github/workflows/appimage.yml)
          have=$(docker run --rm --entrypoint ffmpeg avet:test -version | sed -n 's/^ffmpeg version \([0-9.]*\).*/\1/p')
          [ "$want" = "$have" ] || echo "::warning::the image has FFmpeg $have, appimage.yml builds $want"

      - name: Upload test images
        uses: actions/upload-artifact@v7
        with:
          name: avet-test-image-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/avet-test.tar
            ${{ runner.temp }}/avet-fixture-tools.tar
          if-no-files-found: error
          retention-days: 1

  integration:
    name: integration (${{ matrix.suite }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [suites, image]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.suites.outputs.list) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Download test images
        uses: actions/download-artifact@v8
        with:
          name: avet-test-image-${{ matrix.arch }}
          path: ${{ runner.temp }}

      - name: Load test images
        run: |
          docker load -i "$RUNNER_TEMP/avet-test.tar"
          docker load -i "$RUNNER_TEMP/avet-fixture-tools.tar"

      - name: Run integration tests
        env:
          SUITE: ${{ matrix.suite }}
        run: ./test/run.sh --no-build "$SUITE"

  build:
    needs: [test, msrv, integration]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-26.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GITHUB_IMAGE }}
          labels: org.opencontainers.image.licenses=GPL-3.0-only

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ env.GITHUB_IMAGE }},docker.io/${{ env.DOCKERHUB_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  push:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GITHUB_IMAGE }}
            docker.io/${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Create and push multi-arch manifest to GHCR
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map(select(startswith("ghcr.io"))) | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.GITHUB_IMAGE }}@sha256:%s ' *)

      - name: Prepare Docker Hub README
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          printf '**Note:** This description is automatically generated from the [GitHub repository README](https://github.com/ivenos/avet).\n\n---\n\n' \
            | cat - README.md > /tmp/dockerhub-readme.md

      - name: Create and push multi-arch manifest to Docker Hub
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map(select(startswith("ghcr.io") | not)) | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'docker.io/${{ env.DOCKERHUB_IMAGE }}@sha256:%s ' *)

      - name: Update Docker Hub description
        if: startsWith(github.ref, 'refs/tags/')
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          readme-filepath: /tmp/dockerhub-readme.md
