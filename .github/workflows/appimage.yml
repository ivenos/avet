name: AppImage

# Also on changes to this file: the pinned tool versions live here, and a bump that
# breaks the build would otherwise surface at the next release and nowhere else.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the artifact names, e.g. v1.0.0. Empty uses dev-<sha>."
        required: false
  pull_request:
    paths: [".github/workflows/appimage.yml", ".github/scripts/crate-licenses.sh", "packaging/**"]
  push:
    branches: [main]
    paths: [".github/workflows/appimage.yml", ".github/scripts/crate-licenses.sh", "packaging/**"]

env:
  SVT_AV1_VERSION: v4.2.0
  # Rolling-release repo: pin a main commit, bump via PR.
  SVT_AV1_HDR_REF: 18327c0ae91842a548d71303595cf6386fc2433f
  FFMS2_VERSION: "5.0"
  FFMPEG_VERSION: n8.1.2
  VSHIP_VERSION: v5.1.1
  VMAF_VERSION: v3.2.1
  RUST_VERSION: 1.98.1
  LINUXDEPLOY_VERSION: 1-alpha-20251107-1

# Only the release job, which runs nothing but the upload, gets contents: write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A release can be cut from any commit, including one whose tests never ran.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffms2-dev nasm

      - name: Run unit tests
        run: cargo test --locked

  appimage:
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Pinned: the AppImage inherits the runner's glibc as its minimum.
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            enable_avx512: "ON"
          - arch: aarch64
            runner: ubuntu-24.04-arm
            enable_avx512: "OFF"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve version
        # Not interpolated: both are attacker-chosen text and this writes $GITHUB_ENV.
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "release" ]; then
            VERSION="$RELEASE_TAG"
          else
            VERSION="${INPUT_VERSION:-dev-${GITHUB_SHA:0:7}}"
          fi
          case "$VERSION" in
            *[!A-Za-z0-9._-]*|"") echo "::error::refusing unusual version name"; exit 1 ;;
          esac
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake nasm yasm git curl ca-certificates \
            pkg-config autoconf automake libtool meson ninja-build \
            zlib1g-dev libbz2-dev liblzma-dev \
            libopus-dev libmp3lame-dev libvorbis-dev libdav1d-dev \
            libvulkan-dev \
            mkvtoolnix \
            file desktop-file-utils zsync \
            fuse libfuse2

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: appimage-${{ matrix.arch }}

      - name: Build SVT-AV1
        run: |
          git clone --depth 1 --branch "$SVT_AV1_VERSION" \
            https://gitlab.com/AOMediaCodec/SVT-AV1.git /tmp/svt-av1
          cmake -B /tmp/svt-av1/build /tmp/svt-av1 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_AVX512=${{ matrix.enable_avx512 }} -DNATIVE=OFF
          cmake --build /tmp/svt-av1/build --parallel "$(nproc)"
          sudo cmake --install /tmp/svt-av1/build

      - name: Build SVT-AV1-hdr
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/juliobbv-p/svt-av1-hdr.git /tmp/svt-av1-hdr
          git -C /tmp/svt-av1-hdr checkout "$SVT_AV1_HDR_REF"
          cmake -B /tmp/svt-av1-hdr/build /tmp/svt-av1-hdr \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local/hdr \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_AVX512=${{ matrix.enable_avx512 }} -DNATIVE=OFF
          cmake --build /tmp/svt-av1-hdr/build --parallel "$(nproc)"
          sudo cmake --install /tmp/svt-av1-hdr/build
          sudo cp /usr/local/hdr/bin/SvtAv1EncApp /usr/local/bin/SvtAv1EncApp-hdr

      - name: Build FFmpeg
        # Ubuntu 24.04 ships 6.1, too old for Vship (AVCOL_SPC_YCGCO_RE), and the Docker
        # image gets 8.1 from Alpine. Both artifacts run the same ffmpeg this way.
        run: |
          git clone --depth 1 --branch "$FFMPEG_VERSION" \
            https://github.com/FFmpeg/FFmpeg.git /tmp/ffmpeg
          cd /tmp/ffmpeg
          ./configure \
            --prefix=/usr/local \
            --enable-shared --disable-static \
            --disable-doc --disable-ffplay \
            --enable-gpl \
            --enable-libopus --enable-libmp3lame --enable-libvorbis --enable-libdav1d
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig

      - name: Build FFMS2
        run: |
          git clone --depth 1 --branch "$FFMS2_VERSION" \
            https://github.com/FFMS/ffms2.git /tmp/ffms2
          cd /tmp/ffms2
          git apply "$GITHUB_WORKSPACE/packaging/ffms2-frame-hdr-metadata.patch"
          mkdir -p src/config
          autoreconf -fiv
          PKG_CONFIG_PATH=/usr/local/lib/pkgconfig \
            ./configure --prefix=/usr/local --enable-shared=yes --enable-static=no
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig

      - name: Build Vship (FFVship, Vulkan backend)
        run: |
          git clone --depth 1 --branch "$VSHIP_VERSION" \
            https://codeberg.org/Line-fr/Vship.git /tmp/vship
          cd /tmp/vship
          make buildVulkan
          PKG_CONFIG_PATH=/usr/local/lib/pkgconfig make buildFFVSHIP
          sudo install -m755 FFVship /usr/local/bin/FFVship
          sudo install -m755 libvship.so /usr/local/lib/libvship.so
          sudo ldconfig

      - name: Build libvmaf (vmaf tool, for CAMBI)
        run: |
          git clone --depth 1 --branch "$VMAF_VERSION" \
            https://github.com/Netflix/vmaf.git /tmp/vmaf
          meson setup /tmp/vmaf/libvmaf/build /tmp/vmaf/libvmaf \
            --buildtype release \
            -Dbuilt_in_models=false -Denable_float=false \
            -Denable_tests=false -Denable_docs=false
          ninja -C /tmp/vmaf/libvmaf/build
          sudo install -m755 /tmp/vmaf/libvmaf/build/tools/vmaf /usr/local/bin/vmaf

      - name: Build avet
        env:
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
        run: cargo build --release --locked

      - name: Stage AppDir
        run: |
          set -eux
          APPDIR="$PWD/AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib"

          cp target/release/avet              "$APPDIR/usr/bin/"
          cp /usr/local/bin/SvtAv1EncApp      "$APPDIR/usr/bin/"
          cp /usr/local/bin/SvtAv1EncApp-hdr  "$APPDIR/usr/bin/"
          cp /usr/local/bin/ffmsindex         "$APPDIR/usr/bin/"
          cp /usr/local/bin/ffmpeg            "$APPDIR/usr/bin/"
          cp /usr/local/bin/ffprobe           "$APPDIR/usr/bin/"
          cp "$(command -v mkvmerge)"         "$APPDIR/usr/bin/"
          cp /usr/local/bin/FFVship           "$APPDIR/usr/bin/"
          cp /usr/local/bin/vmaf              "$APPDIR/usr/bin/"

          cp /usr/local/lib/libffms2.so*      "$APPDIR/usr/lib/"
          cp /usr/local/lib/libvship.so       "$APPDIR/usr/lib/"

          LICENSES="$APPDIR/usr/share/licenses"
          install -Dm644 LICENSE "$LICENSES/avet/LICENSE"
          .github/scripts/crate-licenses.sh "$LICENSES/avet/crates"
          install -Dm644 -t "$LICENSES/svt-av1"     /tmp/svt-av1/{LICENSE.md,LICENSE-BSD2.md,PATENTS.md}
          install -Dm644 -t "$LICENSES/svt-av1-hdr" /tmp/svt-av1-hdr/{LICENSE.md,LICENSE-BSD2.md,PATENTS.md}
          install -Dm644 -t "$LICENSES/ffmpeg"      /tmp/ffmpeg/{LICENSE.md,COPYING.GPLv2,COPYING.LGPLv2.1}
          install -Dm644 -t "$LICENSES/ffms2"       /tmp/ffms2/COPYING
          install -Dm644 -t "$LICENSES/vship"       /tmp/vship/LICENSE
          install -Dm644 -t "$LICENSES/libvmaf"     /tmp/vmaf/LICENSE
          # linuxdeploy adds the copyright files of the libraries it bundles, not of a copied binary.
          install -Dm644 /usr/share/doc/mkvtoolnix/copyright "$APPDIR/usr/share/doc/mkvtoolnix/copyright"

      - name: Build AppImage
        # A release tag, not "continuous": the same avet tag has to keep producing the
        # same artifact.
        run: |
          set -eux
          curl -fsSLO "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-${{ matrix.arch }}.AppImage"
          chmod +x "linuxdeploy-${{ matrix.arch }}.AppImage"

          OUTPUT="avet-${APP_VERSION}-${{ matrix.arch }}.AppImage" \
          "./linuxdeploy-${{ matrix.arch }}.AppImage" \
            --appdir AppDir \
            --desktop-file packaging/appimage/avet.desktop \
            --icon-file packaging/appimage/avet.svg \
            --output appimage

      - name: Smoke test
        run: |
          set +e
          mkdir -p /tmp/smoke && cd /tmp/smoke
          timeout 10 "$GITHUB_WORKSPACE/avet-${APP_VERSION}-${{ matrix.arch }}.AppImage" 2>&1 | tee smoke.log
          set -e
          grep -q "avet started" smoke.log

      # avet logs "avet started" before touching a tool, so the smoke test above passes
      # on an AppImage with nothing bundled. On this runner /usr/local/lib has every library.
      - name: Every bundled tool starts
        run: |
          set -eux
          cd /tmp
          "$GITHUB_WORKSPACE/avet-${APP_VERSION}-${{ matrix.arch }}.AppImage" --appimage-extract >/dev/null
          docker run --rm -v /tmp/squashfs-root:/app:ro -w /tmp ubuntu:24.04 sh -eux -c '
            BIN=/app/usr/bin
            "$BIN/ffmpeg"           -hide_banner -version >/dev/null
            "$BIN/ffprobe"          -hide_banner -version >/dev/null
            "$BIN/mkvmerge"         --version             >/dev/null
            "$BIN/SvtAv1EncApp"     --version             >/dev/null
            "$BIN/SvtAv1EncApp-hdr" --version             >/dev/null
            "$BIN/vmaf"             --version             >/dev/null
            "$BIN/ffmsindex" 2>&1 | grep -qi usage
            timeout -s KILL 5 "$BIN/avet" >start.log 2>&1 || true
            grep -q "avet started" start.log
            # No GPU here, so "no device" is success and only a loader error is a failure.
            "$BIN/FFVship" --list-gpu >ffvship.log 2>&1 || true
            if grep -qiE "error while loading|symbol lookup error|cannot open shared object|error relocating|symbol not found" ffvship.log; then
              echo "::error::FFVship did not load"
              cat ffvship.log
              exit 1
            fi
          '

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: avet-${{ env.APP_VERSION }}-${{ matrix.arch }}.AppImage
          path: avet-${{ env.APP_VERSION }}-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  release:
    if: github.event_name == 'release'
    needs: appimage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: avet-*.AppImage
          merge-multiple: true

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          files: avet-*.AppImage
          fail_on_unmatched_files: true
